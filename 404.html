<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — QR Durian</title>
<link rel="icon" type="image/svg+xml" href="/durian.svg" />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #09090b; color: #fafafa;
    font-family: "Open Sans", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; text-align: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .logo { width: 72px; height: 72px; opacity: .85; object-fit: contain; }
  h1 {
    font-family: "Urbanist", system-ui, sans-serif;
    font-size: 56px; font-weight: 800; letter-spacing: -.03em;
    color: #9FE870;
  }
  p { color: #a1a1aa; font-size: 17px; }
  a {
    display: inline-flex; align-items: center; gap: 8px;
    background: #9FE870; color: #163300;
    font-family: "Urbanist", system-ui, sans-serif;
    font-weight: 700; font-size: 15px;
    padding: 12px 24px; border-radius: 12px;
    text-decoration: none; letter-spacing: -.01em;
    transition: opacity .15s ease;
  }
  a:hover { opacity: .85; }
</style>
</head>
<body>
  <img src="/durian.svg" alt="qrdurian" class="logo" />
  <h1>404</h1>
  <p>This page doesn't exist — but your QR codes do.</p>
  <a href="/">Back to QR Durian</a>
</body>
</html>
