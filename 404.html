<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — QR Durian</title>
<link rel="icon" type="image/svg+xml" href="/durian.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#9FE870" />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Open+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design-system.css" />
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .spread { flex: 1; display: flex; align-items: center; }
  .wrap { width: 100%; }
  .numeral { grid-column: 1 / 8; font-family: var(--font-display); font-weight: 800;
    font-size: var(--fs-3xl); line-height: 96px; letter-spacing: -.04em; color: var(--accent); margin: 0; }
  .msg { grid-column: 1 / 7; font-size: var(--fs-md); color: var(--muted); margin: 0; }
  .actions { grid-column: 1 / 7; display: flex; gap: var(--sp-3); margin-top: var(--sp-2); }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-6); }
  @media (max-width: 720px) { .numeral, .msg, .actions { grid-column: 1 / -1; } }
</style>
</head>
<body>
<button class="toggle" id="gridToggle" aria-pressed="false"><span class="dot"></span><span class="lbl">Show grid</span></button>

<section class="spread">
  <div class="wrap">
    <div class="grid">
      <div class="band">
        <div class="topbar">
          <a class="brand" href="/"><img src="/durian.svg" alt="qrdurian" /> QR <span>Durian</span></a>
        </div>
      </div>
      <div class="band">
        <h1 class="numeral">404</h1>
      </div>
      <div class="band">
        <p class="msg">This page doesn't exist — but your QR codes do.</p>
      </div>
      <div class="band">
        <div class="actions">
          <a class="btn accent" href="/">Back to the editor</a>
          <a class="btn ghost" href="/looks">Browse designs</a>
        </div>
      </div>
    </div>
    <div class="guides" aria-hidden="true">
      <div class="cols"></div><div class="rows"></div>
      <div class="mline l"></div><div class="mline r"></div>
    </div>
  </div>
</section>

<script src="/design-system.js"></script>
</body>
</html>
