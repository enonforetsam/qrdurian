<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard · qrdurian</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="durian.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #FFE14D; --panel: #ffffff; --panel-2: #fafafa; --text: #18181b; --muted: #71717a;
    --border: #e8e6dd; --accent: #2E7D32; --char: #2b2d31; --char-hover: #3a3d44;
  }
  body {
    margin: 0; font-family: "Open Sans", -apple-system, system-ui, sans-serif;
    color: var(--text); background: #FFE14D;
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.025) 0 2px, transparent 2px 22px);
    min-height: 100vh;
  }
  h1,h2,h3,.brand,.btn,.tab,.stat-n,.dn { font-family: "Urbanist", "Open Sans", sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 18px 80px; }

  /* top bar */
  header {
    display: flex; align-items: center; gap: 12px;
    max-width: 940px; margin: 0 auto; padding: 16px 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; }
  .grow { flex: 1; }
  .pill { background: var(--char); color: #fff; font-weight: 800; font-size: 10px; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; }
  .who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .btn {
    border: none; background: var(--char); color: #fff; border-radius: 11px;
    padding: 9px 15px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 7px; transition: background .15s;
  }
  .btn:hover { background: var(--char-hover); }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn.green { background: var(--accent); }
  .btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* tabs */
  .tabs { display: flex; gap: 4px; max-width: 940px; margin: 0 auto; padding: 4px 18px 0; flex-wrap: wrap; }
  .tab {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    font-weight: 700; font-size: 14px; padding: 10px 14px; border-radius: 11px 11px 0 0;
  }
  .tab.active { background: var(--panel); color: var(--text); }

  .card { background: var(--panel); border-radius: 18px; padding: 20px; margin: 14px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .panel-pad { background: var(--panel); border-radius: 0 18px 18px 18px; padding: 6px 4px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 12.5px; word-break: break-all; }
  input.txt { width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; font: inherit; font-size: 15px; background: var(--panel-2); outline: none; }
  input.txt:focus { border-color: var(--accent); }

  /* stat cards */
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .stat { background: var(--panel); border-radius: 16px; padding: 16px 18px; }
  .stat-n { font-size: 30px; font-weight: 800; line-height: 1; }
  .stat-l { font-size: 12.5px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: .05em; }

  /* chart */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; margin-top: 6px; }
  .bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .bar:hover { opacity: 1; }

  /* QR + design rows */
  .qr { border: 1px solid var(--border-2, #f0eee6); border-radius: 14px; padding: 14px; margin: 10px 0; background: var(--panel-2); }
  .qr .dest { word-break: break-all; font-size: 13px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
  .dcard { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .dcard .thumb { width: 100%; aspect-ratio: 1; object-fit: cover; background: #FFE14D; display: block; cursor: pointer; }
  .dcard .dn { font-size: 13px; font-weight: 700; padding: 8px 10px 2px; }
  .dcard .da { display: flex; gap: 4px; padding: 4px 8px 8px; flex-wrap: wrap; }
  .ico { border: none; background: transparent; cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 6px; border-radius: 7px; }
  .ico:hover { background: #fff; color: var(--text); }
  .center { text-align: center; padding: 40px 16px; }
  .center img { width: 56px; height: 56px; opacity: .9; }
  .hidden { display: none !important; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/"><img src="durian.svg" alt="" />qrdurian</a>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <a class="btn green sm" href="/">+ New QR</a>
  </header>

  <!-- signed-out -->
  <div class="wrap hidden" id="signedOut">
    <div class="card" style="max-width:420px;margin:40px auto;text-align:center">
      <h1 style="margin:0 0 6px">Your qrdurian dashboard</h1>
      <p class="muted">Sign in to manage your tracked QRs, scans and saved designs. We email a one-tap link — no password.</p>
      <div id="soForm">
        <input class="txt" id="soEmail" type="email" placeholder="you@email.com" style="margin:8px 0" />
        <button class="btn" id="soSend" style="width:100%">Email me a sign-in link</button>
      </div>
      <p style="margin-top:14px"><a href="/">← Back to the editor</a></p>
    </div>
  </div>

  <!-- signed-in -->
  <div id="app" class="hidden">
    <div class="tabs">
      <button class="tab active" data-t="overview">Overview</button>
      <button class="tab" data-t="qrs">My QRs</button>
      <button class="tab" data-t="designs">My Designs</button>
      <button class="tab" data-t="settings">Settings</button>
    </div>
    <div class="wrap">
      <div class="panel-pad" id="view"></div>
    </div>
  </div>

<script>
  const API = "https://trace.qrdurian.com";
  const $ = (id) => document.getElementById(id);
  const sess = () => { try { return localStorage.getItem("qrd_session") || ""; } catch (e) { return ""; } };
  const AH = () => ({ Authorization: "Bearer " + sess() });
  const api = (path, opts = {}) => fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), ...AH() } });
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let me = { signedIn: false, pro: false, email: "" };

  // ---------- boot ----------
  (async function () {
    if (!sess()) return showSignedOut();
    try {
      const j = await (await api("/api/auth/me")).json();
      if (!j.signedIn) { localStorage.removeItem("qrd_session"); return showSignedOut(); }
      me = j;
    } catch (e) { return showSignedOut(); }
    showApp();
  })();

  function showSignedOut() {
    $("signedOut").classList.remove("hidden");
    $("soSend").onclick = async () => {
      const email = ($("soEmail").value || "").trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("soEmail").focus(); return; }
      $("soSend").disabled = true; $("soSend").textContent = "Sending…";
      try { await fetch(API + "/api/auth/request", { method: "POST", body: JSON.stringify({ email }) }); } catch (e) {}
      $("soForm").innerHTML = `<p>Check your inbox ✉️ — we sent a link to <b>${esc(email)}</b>.</p>`;
    };
  }

  function showApp() {
    $("app").classList.remove("hidden");
    $("who").innerHTML = `${esc(me.email)} ${me.pro ? '<span class="pill">PRO</span>' : ""}`;
    document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
      render(t.dataset.t);
    });
    render("overview");
  }

  function render(tab) {
    const v = $("view");
    v.innerHTML = `<div class="center muted">Loading…</div>`;
    ({ overview: renderOverview, qrs: renderQRs, designs: renderDesigns, settings: renderSettings }[tab] || renderOverview)(v);
  }

  // ---------- Overview ----------
  async function renderOverview(v) {
    let d = {};
    try { d = await (await api("/api/account/overview")).json(); } catch (e) {}
    const daily = d.daily || [];
    const max = Math.max(1, ...daily.map((x) => x.c));
    // fill 30 days so the chart has a consistent width
    const days = [];
    for (let i = 29; i >= 0; i--) { const dt = new Date(Date.now() - i * 86400e3).toISOString().slice(0, 10); days.push((daily.find((x) => x.d === dt) || { c: 0 }).c); }
    const bars = days.map((c) => `<div class="bar" style="height:${Math.round((c / max) * 100)}%" title="${c} scans"></div>`).join("");
    const top = (d.top || []).filter((t) => t.scans > 0);
    v.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="stat-n">${d.totalScans ?? 0}</div><div class="stat-l">Total scans</div></div>
        <div class="stat"><div class="stat-n">${d.linkCount ?? 0}</div><div class="stat-l">Tracked QRs</div></div>
        <div class="stat"><div class="stat-n">${d.designCount ?? 0}</div><div class="stat-l">Saved designs</div></div>
      </div>
      <div class="card"><div class="between"><h3 style="margin:0">Scans — last 30 days</h3></div>
        <div class="bars">${bars}</div></div>
      <div class="card"><h3 style="margin:0 0 6px">Top codes</h3>
        ${top.length ? top.map((t) => `<div class="between" style="padding:8px 0;border-bottom:1px solid var(--border)"><code>/r/${esc(t.id)}</code><b>${t.scans} scans</b></div>`).join("")
          : `<p class="muted">No scans yet. Make a tracked QR in the editor and share it.</p>`}
      </div>`;
  }

  // ---------- My QRs ----------
  async function renderQRs(v) {
    let d = {};
    try { d = await (await api("/api/account/links")).json(); } catch (e) {}
    const links = d.links || [];
    v.innerHTML = `
      ${me.pro ? "" : `<div class="card"><b>Free plan</b> — basic tracking. <a href="#" id="upQr">Upgrade to edit destinations, export &amp; bulk →</a></div>`}
      <div class="card"><div class="between"><h3 style="margin:0">My tracked QRs</h3>
        <button class="btn sm ghost" id="bulkBtn">Bulk create</button></div>
        <div id="bulkBox" class="hidden" style="margin-top:10px">
          <textarea class="txt" id="bulkIn" placeholder="One link per line…" style="min-height:70px"></textarea>
          <button class="btn sm" id="bulkGo" style="margin-top:8px">Create &amp; download CSV</button>
          <span class="muted" id="bulkOut"></span>
        </div>
      </div>
      ${links.length ? links.map((l) => qrCard(l)).join("") : `<div class="center muted">No tracked QRs yet. In the editor's URL tab, paste a link and tap <b>Track scans</b>.</div>`}`;
    if ($("upQr")) $("upQr").onclick = (e) => { e.preventDefault(); location.href = "/"; };
    $("bulkBtn").onclick = () => $("bulkBox").classList.toggle("hidden");
    $("bulkGo").onclick = bulkCreate;
    links.forEach((l) => wireQR(l));
  }
  function qrCard(l) {
    return `<div class="qr" data-s="${l.secret}">
      <div class="between"><b>${l.scans} scans</b><code>${esc(l.domain || "trace.qrdurian.com")}/r/${esc(l.id)}</code></div>
      <div class="dest muted" style="margin:6px 0">→ <span class="dval">${esc(l.url)}</span></div>
      <div class="acts">
        <button class="btn sm" data-a="edit">Edit destination</button>
        <button class="btn sm ghost" data-a="chart">Analytics</button>
        <a class="btn sm ghost" href="${API}/api/link/export?secret=${l.secret}&s=${encodeURIComponent(sess())}" target="_blank" rel="noopener">CSV</a>
        <a class="btn sm ghost" href="${API}/l/${l.secret}" target="_blank" rel="noopener">Stats page</a>
        <button class="ico" data-a="del" title="Delete">🗑</button>
      </div>
      <div class="chart hidden" style="margin-top:10px"></div>
    </div>`;
  }
  function wireQR(l) {
    const el = document.querySelector(`.qr[data-s="${l.secret}"]`);
    el.querySelector('[data-a="edit"]').onclick = async () => {
      if (!me.pro) return goUpgrade();
      const cur = el.querySelector(".dval").textContent;
      const next = prompt("New destination (the printed QR will repoint, no reprint):", cur);
      if (!next || next === cur) return;
      const r = await api("/api/link/update", { method: "POST", body: JSON.stringify({ secret: l.secret, url: next }) });
      if (r.ok) renderQRs($("view")); else if (r.status === 402) goUpgrade();
    };
    el.querySelector('[data-a="chart"]').onclick = async () => {
      const box = el.querySelector(".chart");
      if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
      box.classList.remove("hidden"); box.innerHTML = `<span class="muted">Loading…</span>`;
      const s = await (await api("/api/link/stats?secret=" + l.secret)).json();
      box.innerHTML = miniChart(s);
    };
    el.querySelector('[data-a="del"]').onclick = async () => {
      if (!confirm("Delete this tracked QR and its scan history? The printed code will stop working.")) return;
      await api("/api/link/delete", { method: "POST", body: JSON.stringify({ secret: l.secret }) });
      renderQRs($("view"));
    };
  }
  function miniChart(s) {
    const daily = s.daily || []; const max = Math.max(1, ...daily.map((x) => x.c));
    const days = []; for (let i = 29; i >= 0; i--) { const dt = new Date(Date.now() - i * 86400e3).toISOString().slice(0, 10); days.push((daily.find((x) => x.d === dt) || { c: 0 }).c); }
    const bars = days.map((c) => `<div class="bar" style="height:${Math.round((c / max) * 100)}%"></div>`).join("");
    const list = (arr, label) => arr && arr.length ? `<div style="flex:1"><div class="muted" style="font-size:12px;margin-bottom:4px">${label}</div>${arr.slice(0, 5).map((x) => `<div class="between" style="font-size:13px"><span>${esc(x.d || "—")}</span><b>${x.c}</b></div>`).join("")}</div>` : "";
    return `<div class="bars" style="height:60px">${bars}</div>
      <div class="row" style="gap:20px;margin-top:8px;align-items:flex-start">${list(s.country, "Country")}${list(s.device, "Device")}</div>
      ${s.pro ? "" : `<p class="muted" style="font-size:12px">Free shows 30 days. <a href="/">Upgrade</a> for full history + export.</p>`}`;
  }
  async function bulkCreate() {
    if (!me.pro) return goUpgrade();
    const lines = $("bulkIn").value.split("\n").map((s) => s.trim()).filter((s) => /^https?:\/\//i.test(s)).slice(0, 100);
    if (!lines.length) return;
    $("bulkOut").textContent = ` creating ${lines.length}…`;
    const rows = [["destination", "short_link", "stats_link"]];
    for (const url of lines) { try { const j = await (await fetch(API + "/api/track", { method: "POST", body: JSON.stringify({ url, token: sess() }) })).json(); if (j.short) rows.push([url, j.short, j.stats]); } catch (e) {} }
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "qrdurian-bulk.csv"; a.click();
    $("bulkOut").textContent = ` ✓ ${rows.length - 1} created`;
    setTimeout(() => renderQRs($("view")), 800);
  }

  // ---------- My Designs ----------
  async function renderDesigns(v) {
    let d = {};
    try { d = await (await api("/api/designs")).json(); } catch (e) {}
    const designs = d.designs || [];
    v.innerHTML = `
      <div class="card between"><div><b>${designs.length}</b> / ${d.cap || 10} saved designs</div>
        <a class="btn sm green" href="/">+ New design</a></div>
      ${designs.length ? `<div class="dgrid">${designs.map((x) => dCard(x)).join("")}</div>`
        : `<div class="center muted"><img src="durian.svg" alt=""><p>No saved designs yet. In the editor, design a QR and tap <b>Save to my designs</b> — it'll sync here, on every device.</p></div>`}`;
    designs.forEach((x) => wireDesign(x));
  }
  function dCard(x) {
    return `<div class="dcard" data-id="${x.id}">
      <img class="thumb" src="${x.thumb || "durian.svg"}" alt="" data-a="open" />
      <div class="dn">${esc(x.name || "Untitled")}</div>
      <div class="da">
        <button class="ico" data-a="open" title="Open">↗ Open</button>
        <button class="ico" data-a="rename" title="Rename">✎</button>
        <button class="ico" data-a="del" title="Delete">🗑</button>
      </div></div>`;
  }
  function wireDesign(x) {
    const el = document.querySelector(`.dcard[data-id="${x.id}"]`);
    const open = async () => { const j = await (await api("/api/designs/get?id=" + x.id)).json(); if (j.payload) location.href = "/#d=" + j.payload; };
    el.querySelectorAll('[data-a="open"]').forEach((b) => b.onclick = open);
    el.querySelector('[data-a="rename"]').onclick = async () => {
      const name = prompt("Rename design:", x.name || "Untitled"); if (!name) return;
      const j = await (await api("/api/designs/get?id=" + x.id)).json();
      await api("/api/designs/save", { method: "POST", body: JSON.stringify({ id: x.id, name, payload: j.payload }) });
      renderDesigns($("view"));
    };
    el.querySelector('[data-a="del"]').onclick = async () => {
      if (!confirm("Delete this saved design?")) return;
      await api("/api/designs/delete", { method: "POST", body: JSON.stringify({ id: x.id }) });
      renderDesigns($("view"));
    };
  }

  // ---------- Settings ----------
  async function renderSettings(v) {
    v.innerHTML = `
      <div class="card"><h3 style="margin:0 0 4px">Plan</h3>
        <p class="muted">${me.pro ? "You're on <b>qrdurian Pro</b> ✨" : "Free plan — upgrade for dynamic QRs, full analytics, custom domain, bulk and higher limits."}</p>
        ${me.pro ? `<a class="btn ghost sm" href="https://app.lemonsqueezy.com/my-orders" target="_blank" rel="noopener">Manage billing</a>`
          : `<button class="btn" id="upgrade">✨ Upgrade to Pro — $5/mo</button>`}
      </div>
      <div class="card"><h3 style="margin:0 0 4px">Custom domain ${me.pro ? "" : '<span class="pill">PRO</span>'}</h3>
        <p class="muted">Short links on your own domain, e.g. <code>go.kedai.my/r/abc</code>. (Point it at our worker too — ask us for setup.)</p>
        <div class="row"><input class="txt" id="domIn" placeholder="go.kedai.my" style="max-width:240px" /><button class="btn sm" id="domGo">Save</button></div>
      </div>
      <div class="card between"><div><b>${esc(me.email)}</b><br><span class="muted">Signed in</span></div>
        <button class="btn ghost sm" id="signout">Sign out</button></div>`;
    if ($("upgrade")) $("upgrade").onclick = () => location.href = "/";
    $("domGo").onclick = async () => {
      if (!me.pro) return goUpgrade();
      const r = await api("/api/account/domain", { method: "POST", body: JSON.stringify({ domain: $("domIn").value.trim() }) });
      $("domGo").textContent = r.ok ? "✓ Saved" : (r.status === 402 ? "Pro only" : "Error");
      setTimeout(() => $("domGo").textContent = "Save", 1500);
    };
    $("signout").onclick = () => { try { localStorage.removeItem("qrd_session"); } catch (e) {} location.reload(); };
  }

  function goUpgrade() { location.href = "/"; } // upgrade modal lives in the editor
</script>
</body>
</html>
