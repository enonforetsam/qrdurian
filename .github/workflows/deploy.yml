# Auto-deploy the trace Worker on push → Cloudflare (trace.qrdurian.com).
# KrackedDevs deploy framework (SYSTEM rule #9). The SITE uses Cloudflare's
# native git build; this covers the trace/ Worker — the manual-deploy gap.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (SESSION_SECRET, LS_WEBHOOK_SECRET, DEV_KEY) live on Cloudflare
# and are untouched by `wrangler deploy`.
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ["trace/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy trace Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
