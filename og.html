<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #09090b;
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(159,232,112,0.15) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .logo-row {
    display: flex; align-items: center; gap: 20px;
  }
  .logo-row svg { width: 96px; height: 96px; }
  .brand {
    font-size: 64px; font-weight: 800; color: #fafafa;
    letter-spacing: -0.03em; line-height: 1;
  }
  .brand span { color: #9FE870; }
  .tagline {
    font-size: 26px; color: #a1a1aa; font-weight: 400; letter-spacing: -0.01em;
  }
  .pill {
    background: rgba(159,232,112,0.12);
    border: 1px solid rgba(159,232,112,0.3);
    color: #9FE870; font-size: 16px; font-weight: 600;
    padding: 8px 20px; border-radius: 100px; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="content">
  <div class="logo-row">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 6 C16 4.4 15.6 3.2 14.7 2.3" fill="none" stroke="#163300" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M16 4.9L19.39 8.2L24.1 7.85L24.57 12.55L28.41 15.31L25.75 19.22L26.91 23.8L22.36 25.08L20.31 29.34L16 27.4L11.69 29.34L9.64 25.08L5.09 23.8L6.25 19.22L3.59 15.31L7.43 12.55L7.9 7.85L12.61 8.2Z" fill="#9FE870"/>
      <g clip-path="url(#dc)">
        <rect x="9" y="10.5" width="8.3" height="8.3" rx="2" fill="#163300"/>
        <rect x="10.7" y="12.2" width="4.9" height="4.9" rx="1.2" fill="#9FE870"/>
        <rect x="12.1" y="13.6" width="2.1" height="2.1" rx=".55" fill="#163300"/>
        <g fill="#163300">
          <rect x="21" y="10.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="18" y="13.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="21" y="16.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="9" y="19.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="15" y="19.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="12" y="22.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="18" y="22.5" width="2.3" height="2.3" rx=".7"/>
          <rect x="21" y="22.5" width="2.3" height="2.3" rx=".7"/>
        </g>
      </g>
      <defs><clipPath id="dc"><circle cx="16" cy="17.5" r="10.1"/></clipPath></defs>
    </svg>
    <div class="brand">QR <span>Durian</span></div>
  </div>
  <div class="tagline">Free QR Code Designer — no signup required</div>
  <div class="pill">qrdurian.com</div>
</div>
</body>
</html>
