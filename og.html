<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #09090b;
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .bg-glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(159,232,112,0.15) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .logo-row {
    display: flex; align-items: center; gap: 20px;
  }
  .logo-row svg { width: 96px; height: 96px; }
  .brand {
    font-size: 64px; font-weight: 800; color: #fafafa;
    letter-spacing: -0.03em; line-height: 1;
  }
  .brand span { color: #9FE870; }
  .tagline {
    font-size: 26px; color: #a1a1aa; font-weight: 400; letter-spacing: -0.01em;
  }
  .pill {
    background: rgba(159,232,112,0.12);
    border: 1px solid rgba(159,232,112,0.3);
    color: #9FE870; font-size: 16px; font-weight: 600;
    padding: 8px 20px; border-radius: 100px; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="content">
  <div class="logo-row">
    <img src="durian.svg" alt="qrdurian" style="width:104px;height:104px;object-fit:contain;image-rendering:pixelated" />
    <div class="brand">QR <span>Durian</span></div>
  </div>
  <div class="tagline">Free QR Code Designer — no signup required</div>
  <div class="pill">qrdurian.com</div>
</div>
</body>
</html>
