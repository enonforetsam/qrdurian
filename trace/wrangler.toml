name = "qrdurian-trace"
main = "worker.js"
compatibility_date = "2026-06-01"
routes = [{ pattern = "trace.qrdurian.com", custom_domain = true }]

# free, no-signup: no secrets required. Optional var SITE (design-link redirect origin).

[[d1_databases]]
binding = "DB"
database_name = "qrdurian-trace"
database_id = "92dfaa4b-7c50-4232-b715-9ea8a322d19a"

# optional — orchard photos
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "qrdurian-photos"

# ---- STAGING env (isolated worker + its own D1) ----
# Deploy: `wrangler deploy --env staging`  →  trace-staging.qrdurian.com
# Named envs DON'T inherit bindings/routes/vars — re-declared here.
[env.staging]
name = "qrdurian-trace-staging"
main = "worker.js"
compatibility_date = "2026-06-01"
routes = [{ pattern = "trace-staging.qrdurian.com", custom_domain = true }]
vars = { SITE = "https://staging.qrdurian.pages.dev" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "qrdurian-trace-staging"
database_id = "4c7db14d-6c7d-4b15-9a8b-bd6cb2691c61"
