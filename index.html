<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>QR Durian — Free QR Code Designer</title>
<meta name="description" content="Design beautiful, custom QR codes in seconds. Free, no signup required." />
<meta property="og:title" content="QR Durian — Free QR Code Designer" />
<meta property="og:description" content="Design beautiful, custom QR codes in seconds. Free, no signup required." />
<meta property="og:url" content="https://qrdurian.com" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://qrdurian.com/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="QR Durian — Free QR Code Designer" />
<meta name="twitter:description" content="Design beautiful, custom QR codes in seconds. Free, no signup required." />
<meta name="twitter:image" content="https://qrdurian.com/og.png" />
<link rel="icon" type="image/svg+xml" href="durian.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#163300" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script src="https://unpkg.com/lucide@0.452.0"></script>
<style>
  :root {
    --bg: #f4f4f5;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --text: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --border-2: #ededf0;
    --accent: #2E7D32;   /* durian-leaf green */
    --accent-ink: #ffffff; /* text/icons on accent */
    --ring: rgba(46,125,50,.28);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
    --radius: 18px;
    --sat: env(safe-area-inset-top, 0px);
  }
  [data-theme="dark"] {
    --bg: #09090b;
    --panel: #18181b;
    --panel-2: #1f1f23;
    --text: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --border-2: #2a2a2e;
    --accent: #9FE870;     /* bright green stays for dark backgrounds — visibility */
    --accent-ink: #163300;
    --ring: rgba(159,232,112,.45);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    transition: background .3s ease, color .3s ease;
  }

  header {
    display: flex; align-items: center; justify-content: center;
    padding: calc(18px + var(--sat)) 28px 18px;
    width: 100%;
    position: relative;
  }
  .shuffle-btn {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--panel); color: var(--accent);
    display: grid; place-items: center; cursor: pointer;
    transition: background .2s ease;
  }
  .shuffle-btn:hover { background: var(--panel-2); }
  .shuffle-btn svg { width: 19px; height: 19px; }
  /* display face: Urbanist for brand, titles, labels, buttons */
  .brand, .sheet-title, .lbl, .clabel, .btn, .chip-color, .mini-btn,
  .fmt-row .fname, .preset .ptxt, .divider {
    font-family: "Urbanist", "Open Sans", system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; font-size: 19px; letter-spacing: -.01em; }
  .brand .mark { width: 40px; height: 40px; display: grid; place-items: center; }
  .brand .mark svg { width: 40px; height: 40px; }
  .brand .dim { color: var(--muted); font-weight: 500; }
  @media (min-width: 881px) {
    .brand { font-size: 28px; gap: 16px; }
    .brand .mark, .brand .mark svg { width: 76px; height: 76px; }
  }
  @media (min-width: 1400px) {
    .brand { font-size: 32px; }
    .brand .mark, .brand .mark svg { width: 92px; height: 92px; }
  }

  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    width: 100%; margin: 0 auto;
    padding: 8px 20px calc(100px + env(safe-area-inset-bottom));
  }
  @media (max-width: 880px) {
    /* clear the Dynamic Island, then a little extra so the logo isn't cramped */
    header { padding: calc(26px + var(--sat)) 18px 12px; }
    main { padding-top: 16px; }
    .card.controls, .export-sheet { padding: 16px 18px; } /* outranks the base .card rule */
  }
  .card.controls::-webkit-scrollbar, .export-sheet::-webkit-scrollbar { display: none; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px;
  }

  /* ---------- Artboard preview ---------- */
  .preview {
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
    transition: transform .45s cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
  }

  .artboard-wrap {
    width: 100%; display: flex; justify-content: center;
    overflow: hidden;
  }
  #artboard { transition: width .25s ease, height .25s ease, margin-top .25s ease; }
  body:not(.sheet-open) #artboard { cursor: pointer; }
  @keyframes qrshake {
    0%, 100% { transform: translate(0,0) rotate(0) scale(1); }
    15% { transform: translate(-3px,2px) rotate(-.7deg) scale(.985); }
    35% { transform: translate(3px,-2px) rotate(.6deg) scale(1.01); }
    55% { transform: translate(-2px,-2px) rotate(-.5deg) scale(.99); }
    75% { transform: translate(2px,2px) rotate(.4deg) scale(1.005); }
  }
  #artboard.shaking { animation: qrshake .55s ease both; }

  .btn {
    flex: 1; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 12px; padding: 12px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: -.01em;
    transition: all .15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--muted); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .55; cursor: wait; transform: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 4px 14px var(--ring); }
  .btn.primary:hover { box-shadow: 0 6px 20px var(--ring); }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- Controls ---------- */
  .field { margin-bottom: 22px; }
  .field:last-child { margin-bottom: 0; }
  label.lbl { display: block; font-size: 12px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 9px; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 26px 0 22px; color: var(--muted);
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  textarea, input[type="text"] {
    width: 100%; resize: vertical; min-height: 52px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 15px;
    color: var(--text); font-size: 15px; font-family: inherit; line-height: 1.45;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"] { min-height: auto; padding: 11px 14px; font-size: 14px; }
  textarea:focus, input[type="text"]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring);
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* segmented presets */
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .preset {
    border: 1px solid var(--border); background: var(--panel-2);
    border-radius: 11px; padding: 10px 4px 8px; cursor: pointer; text-align: center;
    transition: all .15s ease; font-family: inherit;
  }
  .preset:hover { border-color: var(--muted); }
  .preset.active { border-color: var(--accent); background: var(--accent); }
  .preset.active .swatch path, .preset.active .swatch rect, .preset.active .swatch circle { fill: var(--accent-ink); }
  .preset.active .ptxt { color: var(--accent-ink); }
  .preset .swatch { width: 30px; height: 30px; margin: 0 auto 6px; }
  .preset .swatch path, .preset .swatch rect, .preset .swatch circle { fill: var(--text); }
  .preset .swatch [fill="none"] { fill: none !important; } /* keep outline-style icons hollow */
  .preset.active { color: var(--accent-ink); } /* currentColor strokes flip with the fill */
  .preset .ptxt { font-size: 11px; font-weight: 600; color: var(--muted); }
  .preset.txt { padding: 11px 4px; }
  .preset.txt .ptxt { font-size: 12.5px; }

  /* color picker pill */
  .color-pill {
    display: flex; align-items: center; gap: 11px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 12px;
  }
  .color-pill input[type="color"] {
    -webkit-appearance: none; appearance: none; border: none;
    width: 30px; height: 30px; border-radius: 8px; background: none; cursor: pointer; padding: 0;
  }
  .color-pill input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-pill input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 8px; }
  .color-pill .hex { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* swatch row */
  .swatches { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .dot { width: 24px; height: 24px; border-radius: 7px; cursor: pointer; border: 1px solid var(--border-2);
    transition: transform .12s ease; }
  .dot:hover { transform: scale(1.12); }

  /* slider */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    background: var(--border); border-radius: 999px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    border: 3px solid var(--panel); box-shadow: 0 1px 6px rgba(0,0,0,.18);
  }
  .slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .slider-head .val { font-size: 13px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }

  /* logo upload */
  .logo-zone {
    display: flex; align-items: center; gap: 13px;
    border: 1px dashed var(--border); border-radius: 12px; padding: 12px;
    background: var(--panel-2);
  }
  .logo-prev {
    width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--border);
    display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 11px;
  }
  .logo-prev img { width: 100%; height: 100%; object-fit: contain; }
  .logo-actions { display: flex; gap: 8px; }
  .mini-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 9px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s ease; font-family: inherit;
  }
  .mini-btn:hover { border-color: var(--muted); }
  .mini-btn.ghost { color: var(--muted); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 9px; line-height: 1.5; }

  /* compact control rows (label left, controls right) */
  .crow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 9px; min-height: 34px;
  }
  .crow:last-child { margin-bottom: 0; }
  .clabel {
    font-size: 11px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0;
  }
  .mini-presets { display: flex; gap: 6px; }
  .preset.sm { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 10px; }
  .preset.sm .swatch { width: 18px; height: 18px; margin: 0; }
  .preset.sm.txt { width: auto; padding: 0 13px; }
  .crow input[type="range"] { flex: 1; max-width: 180px; }
  .crow .val { font-size: 12.5px; font-weight: 650; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  .color-chips { display: flex; gap: 7px; flex-wrap: nowrap; width: 100%; }
  .color-chips .chip-color { flex: 1; justify-content: center; padding: 8px 6px; white-space: nowrap; }
  .chip-color {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .chip-color:hover { border-color: var(--muted); }
  .chip-color.compact { padding: 7px 9px; }
  .cdot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-2); }

  .color-pop {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 12px;
    margin: -4px 0 13px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .color-pop[hidden] { display: none; }
  .color-pop .swatches { margin-top: 0; }
  .chip-color.editing { border-color: var(--accent); }
  .vhid { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  @keyframes fadeup { from { opacity: 0; transform: translateY(5px); } }
  .gen-msg {
    margin-top: 10px; text-align: right;
    font-size: 13px; font-weight: 650;
    font-family: "Urbanist", "Open Sans", system-ui, sans-serif;
    color: var(--accent);
    animation: fadeup .35s ease;
  }
  .gen-msg[hidden] { display: none; }

  .logo-mini { display: flex; align-items: center; gap: 8px; }
  .logo-mini .logo-prev { width: 36px; height: 36px; border-radius: 9px; }

  /* ---------- Bottom nav + sheets (all screens) ---------- */
  .export-sheet { background: var(--panel); border: 1px solid var(--border); padding: 18px; }
  .fmt-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    font-family: inherit; text-align: left; transition: all .15s ease;
  }
  .select {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600;
    font-family: "Urbanist", "Open Sans", system-ui, sans-serif;
    cursor: pointer; transition: border-color .15s ease;
  }
  .select:hover { border-color: var(--muted); }
  .select svg { width: 16px; height: 16px; transition: transform .2s ease; }
  .select.open svg { transform: rotate(180deg); }
  /* floating dropdowns — overlay the page, never change the card's height */
  #fmtList, #texList {
    position: fixed; z-index: 80;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px;
    max-height: 250px; overflow-y: auto;
  }
  #fmtList .fmt-row, #texList .fmt-row { margin-bottom: 6px; }
  #fmtList .fmt-row:last-child, #texList .fmt-row:last-child { margin-bottom: 0; }
  .fmt-row .fcol { display: flex; flex-direction: column; gap: 2px; }
  .fmt-row .fname { font-size: 14px; font-weight: 650; }
  .fmt-row .fdims { font-size: 11.5px; color: var(--muted); }
  .fmt-row .tick { opacity: .18; font-size: 15px; }
  .fmt-row.active { border-color: var(--accent); }
  .fmt-row.active .tick { opacity: 1; color: var(--accent); }
  .export-actions { display: flex; gap: 8px; margin-top: 14px; }
  .export-actions .btn.primary { background: #101113; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.22); }

    /* Wise-style floating pill nav */
    .bottom-nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 60;
      display: flex; gap: 6px;
      background: #ffffff;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: none;
      border-radius: 999px; padding: 7px;
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(24,24,27,.82);
    }
    .nav-item {
      width: 48px; height: 48px; border-radius: 50%;
      display: grid; place-items: center;
      border: none; background: transparent; color: var(--accent);
      cursor: pointer; transition: all .18s ease;
    }
    .nav-item svg { width: 21px; height: 21px; }
    .nav-item:active { transform: scale(.92); }
    .nav-item.active { background: var(--accent); color: var(--accent-ink); }
    .nav-item.export { background: #101113; color: #fff; } /* black = download, everywhere */

    /* invisible click-catcher — QR stays bright while editing */
    .sheet-backdrop {
      display: block; position: fixed; inset: 0; z-index: 40;
      background: transparent; pointer-events: none;
    }
    body.sheet-open .sheet-backdrop { pointer-events: auto; }

    .card.controls, .export-sheet {
      display: block;
      position: fixed; left: 12px; right: 12px; z-index: 50;
      margin: 0 auto; max-width: 480px;
      bottom: calc(88px + env(safe-area-inset-bottom));
      border-radius: 26px;
      border: none;
      max-height: min(46vh, 420px); overflow-y: auto;
      scrollbar-width: none; /* content is designed to fit — no visible scroll */
      /* pop in/out from the card's own center — no vertical travel */
      transform: scale(.92);
      opacity: 0;
      visibility: hidden;
      will-change: transform, opacity;
      /* exit: unhurried, decisive ease-in */
      transition:
        transform .26s cubic-bezier(.4, 0, .7, 1),
        opacity .22s cubic-bezier(.4, 0, .7, 1),
        visibility 0s linear .26s;
      box-shadow: none; /* flat, hairline border only */
    }
    .card.controls.visible, .export-sheet.visible {
      transform: scale(1);
      opacity: 1;
      visibility: visible;
    }
    /* enter/switch bounces are driven by the Web Animations API in JS */

    @media (prefers-reduced-motion: reduce) {
      .card.controls, .export-sheet,
      .card.controls.visible, .export-sheet.visible {
        transition: opacity .15s ease, visibility 0s linear .15s;
        transform: none;
      }
      #artboard.shaking { animation: none !important; }
    }
    .card.controls .panel { display: none; }
    .card.controls .panel.active { display: block; }
    .card.controls .divider { display: none; }

    /* subtle step indicator — lines brighten as you move through the flow */
    .steps { display: flex; gap: 6px; justify-content: center; margin: 2px 0 12px; }
    .sheet-close.corner { position: absolute; top: 12px; right: 12px; z-index: 5; }
    .step {
      width: 30px; height: 3px; border-radius: 999px;
      background: var(--text); opacity: .09;
      transition: opacity .35s ease, background .35s ease;
    }
    .step.done { opacity: .3; }
    .step.current { background: var(--accent); opacity: 1; }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .sheet-title { font-size: 15px; font-weight: 700; }
    .sheet-nav { display: flex; gap: 6px; }
    /* step nav pinned at the card's bottom-right — same screen spot on every card */
    .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .sheet-foot .sheet-close { width: 36px; height: 36px; }
    .sheet-foot .sheet-close svg { width: 17px; height: 17px; }
    .sheet-close {
      border: none; background: var(--panel-2); color: var(--muted);
      width: 30px; height: 30px; border-radius: 999px; cursor: pointer; font-size: 13px;
      font-family: inherit; display: grid; place-items: center;
    }
    .sheet-close svg { width: 15px; height: 15px; }
    .sheet-close:disabled { opacity: .3; cursor: default; }

    /* larger screens: lift the nav off the edge, sheets follow */
    @media (min-width: 881px) {
      .bottom-nav { bottom: 32px; }
      .card.controls, .export-sheet { bottom: 110px; }
    }
    /* short landscape windows: compact chrome so QR + sheet still fit */
    @media (max-height: 500px) {
      header { padding: 8px 18px; }
      .bottom-nav { bottom: 8px; padding: 5px; }
      .nav-item { width: 42px; height: 42px; }
      .card.controls, .export-sheet { max-height: 62vh; bottom: 70px; }
    }
</style>
</head>
<body>
  <header>
    <div class="brand" aria-label="qrdurian">
      <span class="mark">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="qrdurian">
          <path d="M16 4.9L19.39 8.2L24.1 7.85L24.57 12.55L28.41 15.31L25.75 19.22L26.91 23.8L22.36 25.08L20.31 29.34L16 27.4L11.69 29.34L9.64 25.08L5.09 23.8L6.25 19.22L3.59 15.31L7.43 12.55L7.9 7.85L12.61 8.2Z"
                fill="#9FE870" stroke="#9FE870" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 6.2 C16 4.4 15.5 3.1 14.4 2.2" fill="none" stroke="#163300" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M15.4 3.2 C16.8 1.5 19.2 1.6 20.1 2.7 C19 4.5 16.6 4.5 15.4 3.2 Z" fill="#9FE870" stroke="#163300" stroke-width="1" stroke-linejoin="round"/>

<script>
  const $ = (id) => document.getElementById(id);

  const FORMATS = {
    square:    { w: 2048, h: 2048, label: "2048 × 2048 px · sticker / social" },
    wallpaper: { w: 1290, h: 2796, label: "1290 × 2796 px · phone lock screen" },
    poster:    { w: 2480, h: 3508, label: "2480 × 3508 px · A4 @ 300 DPI" },
    story:     { w: 1080, h: 1920, label: "1080 × 1920 px · 9:16 story" },
  };

  const state = {
    data: "https://danialalias.com",
    dotType: "rounded",
    cornerType: "extra-rounded",
    fg: "#18181b",
    base: "#ffffff", /* the card under the QR */
    bg: "#FFE14D",   /* page / scene background — bright durian yellow */
    outline: "#18181b",
    outlineW: 7,     /* 0 = no outline */
    margin: 2,
    logo: undefined,
    format: "square",
    sceneBg: "gradient",
    texture: "waves",
    qrScale: 0.58,
    pos: "center",
    caption: "SCAN ME",
  };

  const swatchSet = ["#FFE14D","#163300","#18181b","#ffffff","#9FE870","#ef4444","#6366f1","#ec4899","#0ea5e9","#f97316"];

  // ================= QR rendering (cached image) =================
  function currentOpts(size, transparentBg = false) {
    return {
      width: size, height: size, type: "canvas",
      data: state.data || " ",
      margin: Math.round(state.margin * size / 320),
      qrOptions: { errorCorrectionLevel: state.logo ? "H" : "Q" },
      dotsOptions: { type: state.dotType, color: state.fg },
      cornersSquareOptions: { type: state.cornerType, color: state.fg },
      cornersDotOptions: { type: state.cornerType === "extra-rounded" ? "dot" : state.cornerType, color: state.fg },
      backgroundOptions: { color: transparentBg ? "rgba(0,0,0,0)" : cardColor() },
      image: state.logo,
      imageOptions: { crossOrigin: "anonymous", margin: Math.round(6 * size / 320), imageSize: 0.4 },
    };
  }

  async function qrImageAt(size, transparentBg = false) {
    const blob = await new QRCodeStyling(currentOpts(size, transparentBg)).getRawData("png");
    const img = new Image();
    const url = URL.createObjectURL(blob);
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = url;
    });
    if (img.decode) await img.decode().catch(() => {});
    URL.revokeObjectURL(url); // don't leak a blob per regeneration
    return img;
  }

  let qrImg = null, qrToken = 0, qrTimer = null;
  function queueQr() {
    clearTimeout(qrTimer);
    qrTimer = setTimeout(async () => {
      const t = ++qrToken;
      try {
        const img = await qrImageAt(1024, true);
        if (t === qrToken) { qrImg = inkify(img, 1024); drawPreview(); }
      } catch (e) { /* invalid data mid-typing — keep last good image */ }
    }, 120);
  }

  // ================= Scene renderer (preview AND export) =================
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.max(0, (n >> 16) + amt));
    const g = Math.min(255, Math.max(0, ((n >> 8) & 255) + amt));
    const b = Math.min(255, Math.max(0, (n & 255) + amt));
    return `rgb(${r},${g},${b})`;
  }
  function bgLum() {
    const n = parseInt(state.bg.slice(1), 16);
    return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  }
  function cardColor() {
    return state.base; /* user-chosen card color, independent of the background */
  }
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ================= Background textures =================
  const STAR = "M16 4.9L19.39 8.2L24.1 7.85L24.57 12.55L28.41 15.31L25.75 19.22L26.91 23.8L22.36 25.08L20.31 29.34L16 27.4L11.69 29.34L9.64 25.08L5.09 23.8L6.25 19.22L3.59 15.31L7.43 12.55L7.9 7.85L12.61 8.2Z";
  const TEXTURE_NAMES = {
    none: "None", durians: "Durians", topo: "Topography", dots: "Dots", grid: "Grid",
    stripes: "Stripes", waves: "Waves", crosses: "Crosses", spikes: "Spikes", leaves: "Leaves", hex: "Hexagons",
  };
  function textureSVG(key) {
    const ink = bgLum() < 140 ? "rgba(255,255,255,0.10)" : "rgba(0,0,0,0.08)";
    const T = {
      durians: [96, `<g fill="none" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round"><path transform="translate(8,8) scale(.5)" d="${STAR}"/><path transform="translate(56,56) scale(.5)" d="${STAR}"/></g>`],
      topo: [88, `<g fill="none" stroke="${ink}" stroke-width="1.4"><path d="M44 16 C60 16 70 28 68 42 C66 56 54 64 42 62 C28 60 18 50 20 38 C22 26 30 16 44 16 Z"/><path d="M44 26 C54 26 60 33 59 42 C58 51 50 56 42 54 C33 52 28 46 29 38 C30 30 36 26 44 26 Z"/><path d="M44 35 C49 35 52 38 51.5 42 C51 46 47 48 43 47 C39 46 37 43 37.5 40 C38 37 40 35 44 35 Z"/></g>`],
      dots: [22, `<g fill="${ink}"><circle cx="5.5" cy="5.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/></g>`],
      grid: [22, `<path d="M22 .5H.5V22" fill="none" stroke="${ink}" stroke-width="1"/>`],
      stripes: [22, `<path d="M-5 5L5 -5M0 22L22 0M17 27L27 17" fill="none" stroke="${ink}" stroke-width="1.6"/>`],
      waves: [26, `<path d="M0 7 Q6.5 0 13 7 T26 7" fill="none" stroke="${ink}" stroke-width="1.6" transform="translate(0,3)"/><path d="M0 7 Q6.5 0 13 7 T26 7" fill="none" stroke="${ink}" stroke-width="1.6" transform="translate(0,16)"/>`],
      crosses: [28, `<g stroke="${ink}" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M7 3.5v7M3.5 7h7"/><path d="M21 17.5v7M17.5 21h7"/></g>`],
      spikes: [26, `<g fill="none" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"><path d="M7 4l4.5 8H2.5Z"/><path d="M19 14l4.5 8h-9Z"/></g>`],
      leaves: [30, `<g fill="none" stroke="${ink}" stroke-width="1.5"><path d="M4 13 C4 7 10 4 16 4 C16 10 10 13 4 13Z"/><path d="M16 26 C16 20 21 17 27 17 C27 23 22 26 16 26Z"/></g>`],
      hex: [32, `<path d="M16 3L27 9.5V22.5L16 29L5 22.5V9.5Z" fill="none" stroke="${ink}" stroke-width="1.4"/>`],
    };
    const t = T[key];
    if (!t) return null;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${t[0]}" height="${t[0]}">${t[1]}</svg>`;
  }
  function textureURI() {
    const svg = state.texture !== "none" ? textureSVG(state.texture) : null;
    return svg ? `data:image/svg+xml,${encodeURIComponent(svg)}` : null;
  }

  // generate-animation state (preview only)
  const fx = { blur: 0, alpha: 1 };

  function drawQrRounded(ctx, img, x, y, size, r, fxBlur = 0, fxAlpha = 1) {
    ctx.save();
    roundRectPath(ctx, x, y, size, size, r);
    ctx.clip();
    if (typeof ctx.filter === "string" && fxBlur > 0.1) ctx.filter = `blur(${fxBlur}px)`;
    ctx.globalAlpha = fxAlpha;
    ctx.drawImage(img, x, y, size, size);
    ctx.restore();
  }

  // ================= Ink engine =================
  // Turns crisp QR modules into realistic ink: fiber wicking (jittered passes),
  // ragged organic edges (blur+contrast goo), coffee-ring rim pooling, paper grain.
  function inkify(src, s) {
    const mk = () => { const c = document.createElement("canvas"); c.width = c.height = s; return c; };
    const hasFilter = typeof mk().getContext("2d").filter === "string";

    // no canvas filters (older Safari): skip ink, return crisp modules instead of fuzz
    if (!hasFilter) {
      const plain = mk();
      plain.getContext("2d").drawImage(src, 0, 0, s, s);
      return plain;
    }

    // 1. black silhouette of the modules
    const t1 = mk(), c1 = t1.getContext("2d");
    if (hasFilter) c1.filter = "brightness(0)";
    c1.drawImage(src, 0, 0, s, s);

    // 2. fiber wicking: stack jittered copies so edges grow fuzzy hairs
    const t2 = mk(), c2 = t2.getContext("2d");
    c2.drawImage(t1, 0, 0);
    c2.globalAlpha = 0.3;
    const J = s * 0.003;
    for (let i = 0; i < 7; i++) {
      c2.drawImage(t1, (Math.random() * 2 - 1) * J, (Math.random() * 2 - 1) * J);
    }

    // 3. goo threshold on white: blur + hard contrast = ragged organic blobs
    const t3 = mk(), c3 = t3.getContext("2d");
    c3.fillStyle = "#fff"; c3.fillRect(0, 0, s, s);
    if (hasFilter) c3.filter = `blur(${s * 0.0035}px) contrast(12)`;
    c3.drawImage(t2, 0, 0);

    // 4. soften the result a touch (wet edge)
    const t4 = mk(), c4 = t4.getContext("2d");
    c4.fillStyle = "#fff"; c4.fillRect(0, 0, s, s);
    if (hasFilter) c4.filter = `blur(${s * 0.0012}px)`;
    c4.drawImage(t3, 0, 0);

    // 5. pixel pass: luminance → ink, rim pooling, deterministic paper grain
    const out = mk(), co = out.getContext("2d");
    const d = c4.getImageData(0, 0, s, s).data;
    const od = co.createImageData(s, s), o = od.data;
    const n = parseInt(state.fg.slice(1), 16);
    const fr = n >> 16, fgc = (n >> 8) & 255, fb = n & 255;
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const ink = 1 - d[i] / 255;
      if (ink < 0.45) continue;                      // hard cutoff — no blurry fringe
      const x = p % s, y = (p / s) | 0;
      let h = (x * 374761393 + y * 668265263) | 0;
      h = (h ^ (h >> 13)) * 1274126177;
      const g = ((h ^ (h >> 16)) >>> 0) / 4294967295;
      const edge = Math.min(1, (ink - 0.45) / 0.15); // ~half-pixel anti-alias band only
      const pool = 4 * ink * (1 - ink);              // peaks at boundaries → darker rim
      const dark = Math.min(1, pool * 0.55 + g * 0.12) * 0.35;
      o[i]     = fr * (1 - dark);
      o[i + 1] = fgc * (1 - dark);
      o[i + 2] = fb * (1 - dark);
      o[i + 3] = Math.round(edge * (0.9 + 0.1 * g) * 255);
    }
    co.putImageData(od, 0, 0);

    // 6. keep an uploaded center logo crisp — stamp the original back over the ink
    if (state.logo) {
      const lw = s * 0.48, l0 = (s - lw) / 2;
      co.clearRect(l0, l0, lw, lw);
      co.drawImage(src, l0, l0, lw, lw, l0, l0, lw, lw);
    }
    return out;
  }

  // single source of truth for where everything sits on the artboard —
  // clamps the QR so card + caption can never overflow the canvas
  function sceneLayout(W, H) {
    const u = Math.min(W, H);
    const cap = state.caption.trim();
    const capGap = cap ? u * 0.075 : 0;
    // slider maps 0→1 across the range that actually fits this artboard,
    // so every position changes the size and 80% is always "largest possible"
    const t = (state.qrScale - 0.35) / 0.45;
    const qsMax = Math.min(((H - capGap) / 1.2), W / 1.2) * 0.98;
    const qsLo = Math.min(u * 0.32, qsMax);
    const qs = qsLo + t * (qsMax - qsLo);
    const pad = qs * 0.10;
    const cardSize = qs + pad * 2;
    const x = (W - cardSize) / 2;
    let y;
    if (state.pos === "top") y = H * 0.12;
    else if (state.pos === "bottom") y = H - cardSize - capGap - H * 0.12;
    else y = (H - cardSize - capGap) / 2;
    y = Math.max(H * 0.01, Math.min(y, H - cardSize - capGap - H * 0.01));
    return { u, qs, pad, cardSize, capGap, x, y, cap };
  }

  // paintBg=false for the live preview — the page itself provides the background
  function drawScene(ctx, W, H, qrImage, paintBg = true, texImg = null) {
    if (paintBg) {
      if (state.sceneBg === "solid") {
        ctx.fillStyle = state.bg;
        ctx.fillRect(0, 0, W, H);
      } else {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, shade(state.bg, 14));
        g.addColorStop(1, shade(state.bg, -14));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      if (texImg && texImg.width) {
        const p = ctx.createPattern(texImg, "repeat");
        if (p) {
          ctx.save();
          const s = Math.min(W, H) / 440; // match the on-screen texture density
          ctx.scale(s, s);
          ctx.fillStyle = p;
          ctx.fillRect(0, 0, W / s, H / s);
          ctx.restore();
        }
      }
    } else {
      ctx.clearRect(0, 0, W, H);
    }

    const { u, qs, pad, cardSize, capGap, x, y, cap } = sceneLayout(W, H);

    // the one layer: a clean rounded square
    ctx.save();
    ctx.fillStyle = cardColor();
    roundRectPath(ctx, x, y, cardSize, cardSize, cardSize * 0.16);
    ctx.fill();
    if (state.outlineW > 0) {
      const lw = cardSize * 0.0045 * state.outlineW;
      ctx.strokeStyle = state.outline;
      ctx.lineWidth = lw;
      roundRectPath(ctx, x + lw / 2, y + lw / 2, cardSize - lw, cardSize - lw, Math.max(2, cardSize * 0.16 - lw / 2));
      ctx.stroke();
    }
    ctx.restore();

    if (qrImage) {
      drawQrRounded(ctx, qrImage, x + pad, y + pad, qs, qs * 0.05,
        paintBg ? 0 : fx.blur, paintBg ? 1 : fx.alpha);
    }

    if (cap) {
      ctx.save();
      ctx.fillStyle = state.fg;
      ctx.globalAlpha = .62;
      ctx.textAlign = "center";
      let fs = Math.round(u * 0.042);
      const fontFor = (px) => `700 ${px}px Urbanist, 'Open Sans', -apple-system, Arial, sans-serif`;
      ctx.font = fontFor(fs);
      try { ctx.letterSpacing = `${u * 0.008}px`; } catch (e) {}
      const tw = ctx.measureText(cap).width;
      if (tw > W * 0.92) { fs = Math.max(9, Math.floor(fs * (W * 0.92) / tw)); ctx.font = fontFor(fs); }
      ctx.fillText(cap, W / 2, y + cardSize + capGap);
      ctx.restore();
    }
  }

  // ================= Preview canvas =================
  const canvas = $("artboard");
  const ctx = canvas.getContext("2d");

  function fitPreview() {
    // preview is format-independent: the QR stays put; aspect ratio applies only to the exported file
    const fmt = { w: 1, h: 1 };
    const wrap = $("artboardWrap");
    const wrapW = Math.min(wrap.clientWidth || wrap.parentElement.clientWidth, 440);
    // static: always leave room below for a sheet, so the QR never moves
    // must match the cards' CSS max-height — including the short-landscape override
    const sheetH = window.innerHeight <= 500
      ? window.innerHeight * 0.62
      : Math.min(window.innerHeight * 0.46, 420);
    const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat")) || 0;
    const chrome = (window.innerWidth >= 1400 ? 290 : window.innerWidth > 880 ? 270 : 205) + sat; // header grows with logo + notch
    const zoneH = Math.max(150, window.innerHeight - sheetH - chrome);
    const ar = fmt.w / fmt.h;

    // start with a strict fit, then enlarge so the QR itself stays readable —
    // but never beyond what the zone can show (card + caption must fit the crop window)
    const ef = 0.32 + ((state.qrScale - 0.35) / 0.45) * 0.49; // effective scale of the slider mapping
    let w = Math.min(wrapW, zoneH * ar);
    const capRatio = state.caption.trim() ? 0.075 / ef : 0;
    const fitCap = zoneH / (1.3 + capRatio);
    const targetQR = Math.min(300, fitCap, Math.max(120, zoneH * 0.62));
    if (w * ef < targetQR) w = Math.min(wrapW, targetQR / ef);
    const h = w / ar;

    // if the full scene is taller than the zone, crop it — keep the QR card in view
    wrap.style.height = Math.min(h, zoneH) + "px";
    let offset = 0;
    if (h > zoneH) {
      const L = sceneLayout(w, h);
      const cy = L.y + (L.cardSize + L.capGap) / 2;
      offset = Math.min(0, Math.max(zoneH - h, zoneH / 2 - cy));
    }
    canvas.style.marginTop = offset + "px";

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);

    // no card open → float the QR to the center of the free space; card open → dock up top
    let shift = 0;
    if (!document.body.classList.contains("sheet-open")) {
      const headTotal = document.querySelector("header").offsetHeight + (window.innerWidth <= 880 ? 16 : 8);
      const navTop = window.innerHeight - ((window.innerWidth > 880 ? 32 : 14) + 80);
      shift = Math.max(0, (navTop - headTotal - Math.min(h, zoneH)) / 2);
    }
    canvas.closest(".preview").style.transform = `translateY(${shift}px)`;
  }

  // the page itself becomes the scene background; chrome flips light/dark to match
  function applyPageBg() {
    const tex = textureURI();
    const texLayer = tex ? `url("${tex}"), ` : "";
    document.body.style.background = state.sceneBg === "gradient"
      ? `${texLayer}linear-gradient(180deg, ${shade(state.bg, 14)}, ${shade(state.bg, -14)})`
      : (tex ? `url("${tex}") ${state.bg}` : state.bg);
    document.documentElement.setAttribute("data-theme", bgLum() < 140 ? "dark" : "light");
  }

  function drawPreview() {
    fitPreview();
    applyPageBg();
    drawScene(ctx, canvas.width, canvas.height, qrImg, false);
  }

  // larger screens: keep a card open so the sheet zone isn't dead whitespace
  let wasMobile = window.innerWidth <= 880;
  window.addEventListener("resize", () => {
    const mobile = window.innerWidth <= 880;
    if (wasMobile && !mobile && !openPanel) openSheet("content");
    wasMobile = mobile;
    drawPreview();
  });

  // update(): qrChanged = the QR module image itself needs re-rendering
  function update(qrChanged) {
    if (qrChanged) queueQr();
    drawPreview();
  }

  // ================= Wire controls =================
  $("content").addEventListener("input", (e) => { state.data = e.target.value; update(true); });

  function hookPresets(containerId, dataKey, stateKey, qrChanged) {
    const box = $(containerId);
    box.querySelectorAll(".preset").forEach((b) => {
      b.addEventListener("click", () => {
        box.querySelectorAll(".preset").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        state[stateKey] = b.dataset[dataKey];
        update(qrChanged);
      });
    });
  }
  hookPresets("cornerPresets", "corner", "cornerType", true);
  hookPresets("bgStylePresets", "scenebg", "sceneBg", false);

  // colors: compact chips → popup picker (swatches + native custom)
  let popTarget = "fg";
  function syncChips() {
    $("fgDot").style.background = state.fg;
    $("baseDot").style.background = state.base;
    $("bgDot").style.background = state.bg;
    $("outDot").style.background = state.outline;
  }
  swatchSet.forEach((c) => {
    const d = document.createElement("div");
    d.className = "dot"; d.style.background = c; d.title = c;
    d.addEventListener("click", () => {
      state[popTarget] = c;
      syncChips(); update(popTarget === "fg"); // palette stays open — keep exploring
    });
    $("popSwatches").appendChild(d);
  });
  function setChipEditing() {
    const open = !$("colorPop").hidden;
    $("fgChip").classList.toggle("editing", open && popTarget === "fg");
    $("baseChip").classList.toggle("editing", open && popTarget === "base");
    $("bgChip").classList.toggle("editing", open && popTarget === "bg");
    $("outChip").classList.toggle("editing", open && popTarget === "outline");
  }
  function showPop(target) {
    const pop = $("colorPop");
    if (!pop.hidden && popTarget === target) { hidePop(); return; } // tap again to close
    popTarget = target;
    pop.hidden = false;
    setChipEditing();
  }
  function hidePop() { $("colorPop").hidden = true; setChipEditing(); }
  $("fgChip").addEventListener("click", (e) => { e.stopPropagation(); showPop("fg"); });
  $("baseChip").addEventListener("click", (e) => { e.stopPropagation(); showPop("base"); });
  $("bgChip").addEventListener("click", (e) => { e.stopPropagation(); showPop("bg"); });
  $("outChip").addEventListener("click", (e) => { e.stopPropagation(); showPop("outline"); });
  $("outlineW").addEventListener("input", (e) => {
    state.outlineW = +e.target.value;
    $("outlineWVal").textContent = e.target.value;
    update(false);
  });
  $("popCustom").addEventListener("click", () => {
    const inp = $("popInput");
    inp.value = state[popTarget];
    inp.click();
  });
  $("popInput").addEventListener("input", (e) => {
    state[popTarget] = e.target.value;
    syncChips(); update(popTarget === "fg");
  });
  document.addEventListener("click", (e) => {
    const pop = $("colorPop");
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest(".chip-color")) hidePop();
  });

  $("margin").addEventListener("input", (e) => {
    state.margin = +e.target.value; $("marginVal").textContent = e.target.value; update(true);
  });
  $("caption").addEventListener("input", (e) => { state.caption = e.target.value; update(false); });

  // logo — corners rounded to match the QR design language
  function roundLogo(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const cap = 1024;
        const scale = Math.min(1, cap / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const cx = c.getContext("2d");
        roundRectPath(cx, 0, 0, w, h, Math.min(w, h) * 0.18);
        cx.clip();
        cx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }
  $("logoBtn").addEventListener("click", () => $("logoInput").click());
  $("logoInput").addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        state.logo = await roundLogo(ev.target.result);
      } catch (err) {
        state.logo = ev.target.result; // unreadable as image? use as-is
      }
      $("logoPrev").innerHTML = `<img src="${state.logo}" alt="logo" />`;
      update(true);
    };
    reader.readAsDataURL(file);
  });
  $("logoClear").addEventListener("click", () => {
    state.logo = undefined; $("logoInput").value = "";
    $("logoPrev").textContent = "—"; update(true);
  });

  // format selection — chosen at export time via dropdown, preview reshapes live
  const FORMAT_NAMES = { square: "Square", wallpaper: "Phone wallpaper", poster: "Poster A4", story: "Story 9:16" };
  function syncFmtSelect() {
    $("fmtSelLabel").textContent = `${FORMAT_NAMES[state.format]} · ${FORMATS[state.format].label.split(" · ")[0]}`;
  }
  function setFormat(key) {
    state.format = key;
    document.querySelectorAll("#fmtList .fmt-row").forEach(x => x.classList.toggle("active", x.dataset.fmt === key));
    syncFmtSelect();
    $("fmtList").hidden = true;
    $("fmtSelect").classList.remove("open");
  }
  $("fmtSelect").addEventListener("click", (e) => {
    e.stopPropagation();
    const list = $("fmtList"), sel = $("fmtSelect");
    if (!list.hidden) { list.hidden = true; sel.classList.remove("open"); return; }
    list.hidden = false;
    sel.classList.add("open");
    // anchor to the select; flip upward if there's no room below
    const r = sel.getBoundingClientRect();
    list.style.left = r.left + "px";
    list.style.width = r.width + "px";
    const below = r.bottom + 6;
    if (below + list.offsetHeight > window.innerHeight - 12) {
      list.style.top = Math.max(8, r.top - 6 - list.offsetHeight) + "px";
    } else {
      list.style.top = below + "px";
    }
  });
  document.addEventListener("click", (e) => {
    const list = $("fmtList");
    if (!list.hidden && !list.contains(e.target)) {
      list.hidden = true;
      $("fmtSelect").classList.remove("open");
    }
  });
  Object.keys(FORMATS).forEach((k) => {
    const b = document.createElement("button");
    b.className = "fmt-row" + (k === state.format ? " active" : "");
    b.dataset.fmt = k;
    b.innerHTML = `<span class="fcol"><span class="fname">${FORMAT_NAMES[k]}</span><span class="fdims">${FORMATS[k].label}</span></span><span class="tick">●</span>`;
    b.addEventListener("click", () => setFormat(k));
    $("fmtList").appendChild(b);
  });
  // the card is a transformed ancestor (pop animations), which hijacks the
  // dropdown's position:fixed — host it on <body> so it floats over everything
  document.body.appendChild($("fmtList"));

  // texture dropdown — same floating pattern
  function setTexture(key) {
    state.texture = key;
    $("texSelLabel").textContent = TEXTURE_NAMES[key];
    document.querySelectorAll("#texList .fmt-row").forEach(x => x.classList.toggle("active", x.dataset.tex === key));
    $("texList").hidden = true;
    $("texSelect").classList.remove("open");
    update(false);
  }
  Object.keys(TEXTURE_NAMES).forEach((k) => {
    const b = document.createElement("button");
    b.className = "fmt-row" + (k === state.texture ? " active" : "");
    b.dataset.tex = k;
    b.innerHTML = `<span class="fname">${TEXTURE_NAMES[k]}</span><span class="tick">●</span>`;
    b.addEventListener("click", () => setTexture(k));
    $("texList").appendChild(b);
  });
  document.body.appendChild($("texList"));
  $("texSelect").addEventListener("click", (e) => {
    e.stopPropagation();
    const list = $("texList"), sel = $("texSelect");
    if (!list.hidden) { list.hidden = true; sel.classList.remove("open"); return; }
    list.hidden = false;
    sel.classList.add("open");
    const r = sel.getBoundingClientRect();
    list.style.left = r.left + "px";
    list.style.width = r.width + "px";
    const below = r.bottom + 6;
    if (below + list.offsetHeight > window.innerHeight - 12) {
      list.style.top = Math.max(8, r.top - 6 - list.offsetHeight) + "px";
    } else {
      list.style.top = below + "px";
    }
  });
  document.addEventListener("click", (e) => {
    const list = $("texList");
    if (!list.hidden && !list.contains(e.target)) {
      list.hidden = true;
      $("texSelect").classList.remove("open");
    }
  });

  // shuffle: curated themes only — every roll looks good
  const THEMES = [
    { fg: "#18181b", base: "#ffffff", bg: "#FFE14D", out: "#18181b", tex: "waves" },    // durian classic
    { fg: "#163300", base: "#E8F5D0", bg: "#9FE870", out: "#163300", tex: "leaves" },   // matcha
    { fg: "#163300", base: "#9FE870", bg: "#0B1F00", out: "#9FE870", tex: "topo" },     // midnight grove
    { fg: "#0B2942", base: "#ffffff", bg: "#8ED6F0", out: "#0B2942", tex: "waves" },    // ocean
    { fg: "#4A0E2E", base: "#FFE3EE", bg: "#EC4899", out: "#4A0E2E", tex: "dots" },     // berry
    { fg: "#5A1C00", base: "#FFF3E0", bg: "#F97316", out: "#5A1C00", tex: "stripes" },  // tangerine
    { fg: "#101113", base: "#ffffff", bg: "#E6E6E3", out: "#101113", tex: "grid" },     // studio mono
    { fg: "#2E1065", base: "#F3E8FF", bg: "#A78BFA", out: "#2E1065", tex: "hex" },      // lavender
    { fg: "#0C4A6E", base: "#ffffff", bg: "#BAE6FD", out: "#0C4A6E", tex: "crosses" },  // sky
    { fg: "#4C1D95", base: "#FFF7E6", bg: "#FDBA74", out: "#4C1D95", tex: "spikes" },   // sunset
    { fg: "#064E3B", base: "#ECFDF5", bg: "#6EE7B7", out: "#064E3B", tex: "dots" },     // mint
    { fg: "#1C1917", base: "#ffffff", bg: "#F5F0E6", out: "#1C1917", tex: "topo" },     // paper
  ];
  let lastTheme = -1;
  $("shuffleBtn").addEventListener("click", () => {
    let i;
    do { i = Math.floor(Math.random() * THEMES.length); } while (i === lastTheme);
    lastTheme = i;
    const t = THEMES[i];
    state.fg = t.fg; state.base = t.base; state.bg = t.bg; state.outline = t.out;
    syncChips();
    setTexture(t.tex);
    update(true);
    canvas.classList.add("shaking");
    canvas.addEventListener("animationend", () => canvas.classList.remove("shaking"), { once: true });
    animateGenerate(700);
    $("shuffleBtn").animate(
      [{ transform: "translateY(-50%) rotate(0deg)" }, { transform: "translateY(-50%) rotate(360deg)" }],
      { duration: 500, easing: "ease" }
    );
  });

  // ================= Export =================
  async function busy(btn, fn) {
    btn.disabled = true;
    const saved = btn.innerHTML;
    btn.textContent = "Rendering…";
    try { await fn(); }
    catch (e) { alert("Export failed: " + e.message); }
    finally { btn.innerHTML = saved; btn.disabled = false; }
  }

  function downloadCanvas(c, name) {
    return new Promise((res) => {
      c.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        res();
      }, "image/png");
    });
  }

  async function renderSceneCanvas() {
    const fmt = FORMATS[state.format];
    const realQs = sceneLayout(fmt.w, fmt.h).qs;
    const hiSize = Math.min(4096, Math.max(1024, Math.round(realQs)));
    const hiRes = inkify(await qrImageAt(hiSize, true), hiSize);
    let texImg = null;
    const tex = textureURI();
    if (tex) {
      texImg = new Image();
      await new Promise((res) => { texImg.onload = res; texImg.onerror = res; texImg.src = tex; });
    }
    const c = document.createElement("canvas");
    c.width = fmt.w; c.height = fmt.h;
    drawScene(c.getContext("2d"), fmt.w, fmt.h, hiRes, true, texImg);
    return c;
  }
  async function exportScenePng() {
    await downloadCanvas(await renderSceneCanvas(), `qrdurian-${state.format}.png`);
  }
  async function shareScene() {
    const c = await renderSceneCanvas();
    const blob = await new Promise((res) => c.toBlob(res, "image/png"));
    const file = new File([blob], `qrdurian-${state.format}.png`, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "QR Durian" }); }
      catch (e) { /* user dismissed the share sheet — not an error */ }
    } else {
      alert("Sharing isn't supported in this browser — use Download instead.");
    }
  }
  function exportSvg() {
    return new QRCodeStyling({ ...currentOpts(1024), type: "svg" }).download({ name: "qrdurian-vector", extension: "svg" });
  }
  // file type → one final Download button
  let fileType = "png";
  const FT_HINTS = {
    png: "Full design with ink texture and background.",
    svg: "Clean vector code only — scales to any size, no ink texture.",
  };
  $("fileTypePresets").querySelectorAll(".preset").forEach((b) => {
    b.addEventListener("click", () => {
      $("fileTypePresets").querySelectorAll(".preset").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      fileType = b.dataset.ft;
      $("ftHint").textContent = FT_HINTS[fileType];
    });
  });
  $("downloadBtn").addEventListener("click", () =>
    busy($("downloadBtn"), () => fileType === "png" ? exportScenePng() : exportSvg())
  );
  $("shareBtn").addEventListener("click", () => busy($("shareBtn"), shareScene));

  // ================= Mobile nav + sheets =================
  let openPanel = null;

  // card bounces via Web Animations API — plays unconditionally, no class juggling
  let cardAnim = null;
  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)");
  function bounceCard(el, fromScale, fromOpacity, duration) {
    if (REDUCED_MOTION.matches) return;
    if (cardAnim) cardAnim.cancel();
    cardAnim = el.animate([
      { transform: `scale(${fromScale})`, opacity: fromOpacity, easing: "cubic-bezier(.2,.6,.35,1)" },
      { transform: "scale(1.022)", opacity: 1, offset: .52, easing: "cubic-bezier(.4,0,.5,1)" },
      { transform: "scale(.996)", offset: .8, easing: "cubic-bezier(.4,0,.55,1)" },
      { transform: "scale(1)", opacity: 1 }
    ], { duration });
  }

  function closeSheet() {
    openPanel = null;
    if (cardAnim) cardAnim.cancel(); // let the exit transition own the element
    document.body.classList.remove("sheet-open");
    $("controlsCard").classList.remove("visible");
    $("exportSheet").classList.remove("visible");
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    $("fmtList").hidden = true;
    $("fmtSelect").classList.remove("open");
    $("texList").hidden = true;
    $("texSelect").classList.remove("open");
    drawPreview(); // QR floats back to center
  }
  function openSheet(name) {
    const prev = openPanel;
    openPanel = name;
    document.body.classList.add("sheet-open");
    document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.nav === name));
    const isExport = name === "export";
    $("exportSheet").classList.toggle("visible", isExport);
    $("controlsCard").classList.toggle("visible", !isExport);
    if (!isExport) {
      document.querySelectorAll("#controlsCard .panel").forEach(p =>
        p.classList.toggle("active", p.dataset.panel === name));
    }
    $("navBack").disabled = name === "content";
    if (!isExport) { $("fmtList").hidden = true; $("fmtSelect").classList.remove("open"); }
    const idx = PANEL_ORDER.indexOf(name);
    document.querySelectorAll(".step").forEach((s) => {
      const i = PANEL_ORDER.indexOf(s.dataset.step);
      s.classList.toggle("current", i === idx);
      s.classList.toggle("done", i < idx);
    });
    const target = isExport ? $("exportSheet") : $("controlsCard");
    if (prev && prev !== name) {
      // switching while already open: snap the old card away, bounce the new one
      const outgoing = prev === "export" ? $("exportSheet") : $("controlsCard");
      if (outgoing !== target) {
        outgoing.style.transition = "none";
        outgoing.classList.remove("visible");
        void outgoing.offsetWidth;
        outgoing.style.transition = "";
      }
      bounceCard(target, .96, .65, 440);
    } else if (!prev) {
      // opening from closed: full entrance bounce; QR docks up top
      bounceCard(target, .92, 0, 520);
      drawPreview();
    }
  }
  document.querySelectorAll(".nav-item").forEach(n => {
    n.addEventListener("click", () => openPanel === n.dataset.nav ? closeSheet() : openSheet(n.dataset.nav));
  });
  $("sheetBackdrop").addEventListener("click", closeSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("exportClose").addEventListener("click", closeSheet);
  // tapping the QR itself starts the flow
  $("artboard").addEventListener("click", () => { if (!openPanel) openSheet("content"); });

  // step through the cards in order
  const PANEL_ORDER = ["content", "style", "scene", "export"];
  function stepSheet(dir) {
    const next = PANEL_ORDER[PANEL_ORDER.indexOf(openPanel) + dir];
    if (next) openSheet(next);
  }
  $("navBack").addEventListener("click", () => stepSheet(-1));
  $("navNext").addEventListener("click", () => stepSheet(1));
  $("navBack2").addEventListener("click", () => stepSheet(-1));

  // generate = melt the code into ink, reform it, then move into styling
  let fxRaf = null;
  function animateGenerate(duration = 950) {
    cancelAnimationFrame(fxRaf);
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const k = Math.sin(t * Math.PI); // 0 → 1 → 0: melt then reform
      fx.blur = k * 7;
      fx.alpha = 1 - k * 0.4;
      drawScene(ctx, canvas.width, canvas.height, qrImg, false);
      if (t < 1) fxRaf = requestAnimationFrame(frame);
      else { fx.blur = 0; fx.alpha = 1; drawPreview(); }
    }
    fxRaf = requestAnimationFrame(frame);
  }

  $("generateBtn").addEventListener("click", () => {
    const b = $("generateBtn");
    if (b.disabled) return;
    b.disabled = true;
    const saved = b.innerHTML;
    b.textContent = "Generating…";
    $("genMsg").hidden = true;

    update(true); // fresh QR swaps in mid-melt, while everything is ink
    canvas.classList.add("shaking");
    canvas.addEventListener("animationend", () => canvas.classList.remove("shaking"), { once: true });
    animateGenerate();

    setTimeout(() => {
      b.textContent = "✓ Generated!";
      $("genMsg").hidden = false;
      setTimeout(() => {
        b.innerHTML = saved;
        b.disabled = false;
        $("genMsg").hidden = true;
        if (openPanel === "content") openSheet("style"); // don't re-open if the user closed or moved on
      }, 1400);
    }, 1000);
  });

  // ================= Boot =================
  lucide.createIcons();
  syncChips();
  syncFmtSelect();
  openSheet("content"); // land with the Content card open on every device
  drawPreview();
  queueQr();
</script>
</body>
</html>
